name: Update hardcore TTD-style price snapshot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-ttd-price-hardcore
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node tools/generate-ttd-price-hardcore.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/generated/ttd_price.json
          git diff --cached --quiet || git commit -m "chore: 하드코어 시세 TTD 스타일 스냅샷 자동 갱신"
          git push
